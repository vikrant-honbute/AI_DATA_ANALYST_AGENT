[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-data-analysis-agent"
version = "0.1.0"
description = "LangGraph-based AI data analysis agent with deterministic execution tools and a Streamlit UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0.0,<2",
    "langchain>=1.0.0,<2",
    "langchain-core>=1.0.0,<2",
    "langchain-groq>=1.0.0,<2",
    "groq>=0.37,<1",
    "pydantic>=2.0,<3",
    "pandas>=2.0,<3",
    "matplotlib>=3.7,<4",
    "plotly>=5.18,<7",
    "SQLAlchemy>=2.0,<3",
    "psycopg2-binary>=2.9,<3",
    "pymongo>=4.6,<5",
    "python-dotenv>=1.0,<2",
    "streamlit>=1.30,<2",
    "seaborn>=0.13,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
]

[project.scripts]
ada-agent = "project.main:main"

[tool.setuptools]
packages = [
    "project",
    "project.graph",
    "project.graph.nodes",
    "project.prompts",
    "project.tools",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
